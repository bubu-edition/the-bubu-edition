
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bubu Edition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .opening {
      max-width: 500px;
      width: 100%;
    }

    .warning {
      color: #aaaaaa;
      font-size: 12px;
      letter-spacing: 5px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(30px, 8vw, 48px);
      line-height: 1.2;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .subtitle {
      color: #999999;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 38px;
    }

    button {
      background: #ffffff;
      color: #080808;
      border: none;
      padding: 16px 25px;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <main class="opening">
    <p class="warning">⚠ WARNING ⚠</p>

    <h1>BUBU IS<br>GETTING OLDER.</h1>

    <p class="subtitle">
      Another year of being annoying
      has been successfully completed.
    </p>

    <button>OPEN YOUR SURPRISE →</button>
  </main>

</body>
</html>
